<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat Admin</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Private Chat Admin</h1>
        <p class="subtitle">Manage messages shared with the VS Code extension</p>
      </div>
      <div class="status" id="status">Connecting...</div>
    </header>

    <section class="composer card">
      <label for="message-input">New message</label>
      <textarea id="message-input" rows="4" placeholder="Write a message for the VS Code extension..."></textarea>
      <div class="actions">
        <button id="clear-all" class="secondary" type="button">Clear all</button>
        <button id="send" type="button">Post to MongoDB</button>
      </div>
    </section>

    <section class="list card">
      <div class="list-header">
        <h2>Messages</h2>
        <button id="refresh" class="secondary" type="button">Refresh</button>
      </div>
      <div id="messages" class="messages"></div>
    </section>
  </div>
  <script src="/app.js"></script>
</body>
</html>
